<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网络通信架构与分片权威协议 (V2 定稿) — 交互式评审工作台</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #162032;
      --bg-hover: #26354d;
      --border: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --gold: #fbbf24;
      --green: #34d399;
      --red: #f87171;
      --purple: #a78bfa;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 300px;
      flex-shrink: 0;
      background: #0b1120;
      border-right: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 18px 14px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .search-box {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    .nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
    .nav-item a {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px; border-radius: 6px; color: var(--text-muted);
      text-decoration: none; font-size: 13px; transition: all 0.15s;
    }
    .nav-item a:hover, .nav-item a.active { background: var(--bg-hover); color: var(--text); }
    .nav-item.level-3 a { padding-left: 20px; font-size: 12.5px; }
    .nav-item.level-4 a { padding-left: 32px; font-size: 12px; }
    .nav-badge {
      background: var(--gold); color: #0f172a; font-size: 11px; font-weight: 700;
      padding: 0 6px; border-radius: 999px; min-width: 18px; text-align: center;
    }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); padding: 10px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-muted); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .btn {
      padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-panel); color: var(--text); font-size: 12.5px; cursor: pointer;
      transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
    .btn-primary { background: #0284c7; border-color: #0ea5e9; color: #fff; font-weight: 600; }
    .btn-primary:hover { background: #0369a1; }
    .btn-gold { background: rgba(251, 191, 36, 0.16); border-color: var(--gold); color: var(--gold); }

    .content { max-width: 1380px; width: 100%; margin: 0 auto; padding: 28px 32px 100px; }

    .doc-section {
      margin-bottom: 30px; padding: 20px 24px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 10px; position: relative;
    }
    .doc-section.has-comments { border-left: 3px solid var(--gold); }
    .sec-header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      margin-bottom: 12px; border-bottom: 1px solid rgba(51, 65, 85, 0.6); padding-bottom: 8px;
    }
    .sec-header h1, .sec-header h2, .sec-header h3, .sec-header h4 { margin: 0; color: #f8fafc; }
    .sec-header h1 { font-size: 22px; color: var(--accent); }
    .sec-header h2 { font-size: 18px; color: #7dd3fc; }
    .sec-header h3 { font-size: 16px; color: #bae6fd; }
    .sec-header h4 { font-size: 14.5px; color: var(--purple); }

    blockquote {
      margin: 10px 0; padding: 10px 14px; background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 13.5px; color: #cbd5e1;
    }
    p { margin: 8px 0; font-size: 14px; }
    ul, ol { margin: 8px 0; padding-left: 22px; font-size: 14px; }
    li { margin: 4px 0; }

    .table-wrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th {
      background: #0f172a; color: #93c5fd; font-weight: 600; padding: 9px 10px;
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    td { padding: 8px 10px; border-bottom: 1px solid rgba(51, 65, 85, 0.55); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(38, 53, 77, 0.45); }
    tr.flash-highlight td { animation: flashRow 2.2s ease-out; }
    @keyframes flashRow {
      0% { background: rgba(251, 191, 36, 0.45); }
      40% { background: rgba(56, 189, 248, 0.28); }
      100% { background: transparent; }
    }
    .section-flash { animation: flashSec 2s ease-out; }
    @keyframes flashSec { 0% { box-shadow: 0 0 0 3px var(--gold); } 100% { box-shadow: none; } }

    code {
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(71, 85, 105, 0.6);
      padding: 1px 5px; border-radius: 4px; font-family: Consolas, "Fira Code", monospace;
      font-size: 12.5px; color: #e2e8f0;
    }
    .field-ref {
      display: inline-block; background: var(--accent-soft);
      border: 1px dashed rgba(56, 189, 248, 0.65); color: #7dd3fc;
      padding: 0px 5px; border-radius: 4px; font-family: Consolas, "Fira Code", monospace;
      font-size: 12.5px; cursor: pointer; transition: all 0.15s;
    }
    .field-ref:hover { background: rgba(56, 189, 248, 0.28); border-style: solid; color: #fff; transform: translateY(-1px); }
    .field-ref.is-msg { background: rgba(167, 139, 250, 0.16); border-color: rgba(167, 139, 250, 0.65); color: #ddd6fe; }
    .field-ref.is-msg:hover { background: rgba(167, 139, 250, 0.34); color: #fff; }
    .svg-field-ref { cursor: pointer; fill: #7dd3fc !important; text-decoration: underline; text-decoration-style: dotted; font-weight: 700; }
    .svg-field-ref.is-msg { fill: #c4b5fd !important; }
    .svg-field-ref:hover { fill: #fbbf24 !important; }

    .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: 600; margin-right: 4px; }
    .tag-v2 { background: rgba(52, 211, 153, 0.16); color: var(--green); border: 1px solid rgba(52, 211, 153, 0.4); }
    .tag-todo { background: rgba(251, 191, 36, 0.16); color: var(--gold); border: 1px solid rgba(251, 191, 36, 0.4); }

    .mermaid-box { background: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 12px 0; overflow-x: auto; }

    .comment-bar { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
    .comment-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .comment-item {
      background: rgba(15, 23, 42, 0.75); border: 1px solid var(--border);
      border-left: 3px solid var(--gold); border-radius: 6px; padding: 8px 12px; font-size: 13px;
    }
    .comment-item.type-issue { border-left-color: var(--red); }
    .comment-item.type-ok { border-left-color: var(--green); }
    .comment-item.type-idea { border-left-color: var(--accent); }
    .comment-item.type-question { border-left-color: var(--purple); }
    .comment-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--text-muted); margin-bottom: 4px; }
    .comment-actions button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11.5px; margin-left: 8px; }
    .comment-actions button:hover { color: var(--red); }
    .comment-editor { display: none; flex-direction: column; gap: 8px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; }
    .comment-editor.open { display: flex; }
    .comment-editor textarea { width: 100%; min-height: 68px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px; font-size: 13px; font-family: inherit; resize: vertical; }
    .comment-editor-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .comment-editor select { background: var(--bg-panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 12.5px; }

    #fieldTooltip {
      position: fixed; z-index: 9999; pointer-events: none; display: none;
      max-width: 450px; min-width: 280px; background: rgba(11, 17, 32, 0.97);
      border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px;
      box-shadow: var(--shadow); font-size: 12.5px; color: var(--text);
    }
    .tt-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 8px; }
    .tt-name { font-family: Consolas, monospace; font-weight: 700; font-size: 14px; color: var(--accent); }
    .tt-scope { font-size: 11px; color: var(--purple); background: rgba(167, 139, 250, 0.14); padding: 1px 6px; border-radius: 4px; }
    .tt-desc { margin-bottom: 8px; color: #f1f5f9; line-height: 1.5; }
    .tt-grid { display: grid; grid-template-columns: 62px 1fr; gap: 4px 8px; font-size: 12px; border-top: 1px dashed var(--border); padding-top: 6px; }
    .tt-label { color: var(--text-muted); font-weight: 600; }
    .tt-val { color: #cbd5e1; }
    .tt-hint { margin-top: 8px; font-size: 11px; color: var(--gold); text-align: right; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 9000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; max-width: 760px; width: 100%; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
    .modal-box textarea { width: 100%; height: 320px; background: #0b1120; color: #e2e8f0; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: Consolas, monospace; font-size: 12.5px; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-title">
      <span>网络架构 V2 评审导航</span>
      <span id="totalCommentsBadge" class="nav-badge" title="总批注数">0</span>
    </div>
    <input type="text" id="fieldSearch" class="search-box" placeholder="🔍 搜索字段 / 消息名 (如 reliableSeq)..." />
    <div id="searchResults" style="display:none; max-height: 220px; overflow-y:auto; background:#0f172a; border:1px solid var(--border); border-radius:6px; padding:6px; font-size:12px;"></div>
    <ul class="nav-list" id="navList"></ul>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <span class="tag tag-v2">V2 定稿</span>
        <strong>NETWORK_AND_SYNC.md 评审工作台</strong>
        <span>💡 正文与时序图中的高亮协议/字段均可悬浮查看详情、点击跳转定义</span>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="btnToggleCommentFilter">📌 只看有批注的小节</button>
        <button class="btn btn-primary" id="btnExportComments">📤 导出评审意见 (Markdown)</button>
        <button class="btn" id="btnClearAllComments" style="color:var(--red)">🗑 清空批注</button>
      </div>
    </header>
    <div class="content" id="docContent"></div>
  </main>

  <div id="fieldTooltip"></div>

  <div class="modal-backdrop" id="exportModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:15px;">导出评审意见（Markdown 格式）</strong>
        <button class="btn" onclick="closeExportModal()">关闭</button>
      </div>
      <textarea id="exportText" readonly></textarea>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-primary" id="btnCopyExport">📋 复制到剪贴板</button>
        <button class="btn" id="btnDownloadExport">💾 下载 .md 文件</button>
      </div>
    </div>
  </div>

<script>
// ==================== 1. V2 协议与核心字段字典 ====================
const FIELD_DICT = {
  // 统一可靠层
  'reliableSeq': {
    scope: '§6.1 统一可靠信封', targetId: 'row-env-seq',
    desc: '发送方单调递增序列号（每发一条非高频包 +1；高频移动不带），发送方缓存最近 50 包以备补发。',
    gen: '发送方（Server / Client）', auth: '发送方',
    send: '双向', recv: '对端',
    eff: '接收方检测跳号并主动发 RESEND_REQ 索要漏包'
  },
  'lastRecvSeq': {
    scope: '§6.1 统一可靠信封', targetId: 'row-env-ack',
    desc: '捎带确认（Piggyback ACK）：发送方已连续收到对端的最大 reliableSeq。',
    gen: '发送方（Server / Client）', auth: '发送方',
    send: '双向', recv: '对端',
    eff: '对端据此推进确认水位、清理 50 包缓存，取代独立 ACK'
  },
  'RESEND_REQ': {
    scope: '§6.1 补发请求', targetId: 'sec-6-1',
    desc: '接收方发现 reliableSeq 跳号时主动向发送方索要缺失包 { missingSeqs[] }。',
    gen: '接收方（Server / Client）', auth: '接收方',
    send: '接收方 → 发送方', recv: '发送方',
    eff: '触发发送方查 50 包缓存补发，或回 RESEND_EXPIRED'
  },
  'RESEND_EXPIRED': {
    scope: '§6.1 补发过期通知', targetId: 'sec-6-1',
    desc: '发送方查 50 包缓存发现请求的 seq 已淘汰时明确回复，防止接收方死循环反复询问。',
    gen: '发送方', auth: '发送方',
    send: '发送方 → 请求方', recv: '请求方',
    eff: '停止反复询问，等待下一次镜像包强覆盖兜底'
  },

  // 鉴权、心跳、握手、热加入、结算
  'AUTH': {
    scope: '§6.2 建连鉴权', targetId: 'row-v2-auth',
    desc: '建连首包注册身份；Server 为该角色分配房间内永不复用的唯一 playerId（非座位号）。',
    gen: 'Client', auth: 'Server', send: 'Client → Server', recv: 'Server',
    eff: '建立会话并分配唯一 playerId；同号在线则顶号'
  },
  'AUTH_OK': {
    scope: '§6.2 鉴权通过', targetId: 'row-v2-auth',
    desc: '鉴权成功回执，紧接着下发 ROOM_LIST_SYNC 与 PRESENCE。',
    gen: 'Server', auth: 'Server', send: 'Server → Client', recv: 'Client', eff: '客户端进入已登录态'
  },
  'ROOM_LIST_SYNC': {
    scope: '§6.2 大厅列表', targetId: 'row-v2-lobby',
    desc: '全量活跃房间列表同步。',
    gen: 'Server', auth: 'Server', send: 'Server → Client', recv: 'Client', eff: '刷新大厅房间卡片'
  },
  'PRESENCE': {
    scope: '§6.2 在线名单', targetId: 'row-v2-auth',
    desc: '全服在线玩家 ID 列表同步。',
    gen: 'Server', auth: 'Server', send: 'Server → All', recv: 'Client', eff: '刷新在线列表'
  },
  'ROOM_CREATE': {
    scope: '§6.2 建房', targetId: 'row-v2-lobby',
    desc: '房主发起建房（仅大厅阶段房主有配置权）。',
    gen: 'Host', auth: 'Server', send: 'Host → Server', recv: 'Server', eff: '创建房间并广播 ROOM_UPDATE'
  },
  'ROOM_JOIN': {
    scope: '§6.2 加入房间', targetId: 'row-v2-lobby',
    desc: '玩家加入房间。',
    gen: 'Guest', auth: 'Server', send: 'Guest → Server', recv: 'Server', eff: '分配席位并广播 ROOM_UPDATE'
  },
  'ROOM_ACTION': {
    scope: '§6.2 房间操作', targetId: 'row-v2-lobby',
    desc: 'AUTO_FILL_AI / SET_READY / KICK / SWITCH_MAP / SET_DIFFICULTY 等，全经 ROOM_UPDATE 同步全员。',
    gen: 'Host / Guest', auth: 'Server', send: 'Client → Server', recv: 'Server',
    eff: '修改成员/AI/准备态并广播 ROOM_UPDATE 确保全员视图一致'
  },
  'ROOM_UPDATE': {
    scope: '§6.2 房间一致快照', targetId: 'row-v2-lobby',
    desc: '房间唯一权威快照：确保全员看到的席位、AI 名字职业、准备状态与难度 100% 一致。',
    gen: 'Server', auth: 'Server', send: 'Server → 房间/大厅', recv: 'Host、Guest',
    eff: '刷新大厅房间界面与准备状态'
  },
  'PRE_START_SYNC': {
    scope: '§6.2 开战前握手', targetId: 'row-v2-lobby',
    desc: '开战进图前 Server 向全员请求初始快照（血量/属性），收齐才进图；超时则踢出超时者并留在大厅等待。',
    gen: 'Server', auth: 'Server', send: 'Server → 房间全员', recv: 'Host、Guest',
    eff: '触发各客户端立即回传初始 OWNER_SNAPSHOT'
  },
  'ROOM_START': {
    scope: '§6.2 正式开战', targetId: 'row-v2-lobby',
    desc: '开战前快照收集完毕后，Server 广播正式进图；此后 Host 与 Guest 完全平权。',
    gen: 'Host 发起 → Server 握手后广播', auth: 'Server', send: 'Server → 房间全员', recv: 'Host、Guest',
    eff: '启动服务端 RoomCombatSession，全员切入战斗界面'
  },
  'ROOM_CLOSED': {
    scope: '§6.2 房间销毁', targetId: 'row-v2-lobby',
    desc: '房间销毁通知（无人/结算全员 ACK 或 5s 超时后即刻销毁）。',
    gen: 'Server', auth: 'Server', send: 'Server → 原房全员', recv: 'Host、Guest',
    eff: '销毁服务端房间；已进结算页的客户端仍保持结算界面直到手动关闭'
  },
  'HOT_JOIN_REQ': {
    scope: '§6.2 热加入申请', targetId: 'row-v2-hotjoin',
    desc: '新玩家向 Server 询问热加入；Server 校验有无同职责/同职业 AI 可替，无则直接 HOT_JOIN_DENY。',
    gen: 'Joiner', auth: 'Server', send: 'Joiner → Server', recv: 'Server',
    eff: '校验通过回 HOT_JOIN_ACCEPT，不通过直接拒绝不打扰战局'
  },
  'HOT_JOIN_ACCEPT': {
    scope: '§6.2 同意热加入', targetId: 'row-v2-hotjoin',
    desc: 'Server 同意热加入并要求新玩家上报初始快照。',
    gen: 'Server', auth: 'Server', send: 'Server → Joiner', recv: 'Joiner',
    eff: '触发 Joiner 发送初始 OWNER_SNAPSHOT'
  },
  'MEMBER_HOT_SWAP': {
    scope: '§6.2 热加入融合广播', targetId: 'row-v2-hotjoin',
    desc: 'Server 融合热加入者新快照后广播全员与热加入者。',
    gen: 'Server', auth: 'Server', send: 'Server → 全房 + Joiner', recv: 'Host、Guest、Joiner',
    eff: '全员移除被替 AI 并合入新玩家；Joiner 切入战斗'
  },
  'PING': {
    scope: '§6.2 阶梯心跳', targetId: 'row-v2-hb',
    desc: '房间内 15s 常规心跳；若已被踢出后幽灵客户端又发来 PING，Server 直接踢走须重新握手。',
    gen: 'Client', auth: 'Server', send: 'Client → Server', recv: 'Server', eff: '维持在线或触发幽灵踢出'
  },
  'PONG': {

// ==================== 3. 批注存储与渲染 ====================
const STORAGE_KEY = 'cata_net_arch_review_comments_v2';
let commentsMap = {};
try { commentsMap = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { commentsMap = {}; }
function saveComments() { localStorage.setItem(STORAGE_KEY, JSON.stringify(commentsMap)); refreshCommentCounts(); }

function enhanceFieldsInHtml(html) {
  return html.replace(/<code>([^<]+)<\/code>/g, (full, inner) => {
    const clean = inner.trim();
    if (FIELD_DICT[clean]) {
      const isMsg = /^[A-Z0-9_]+$/.test(clean);
      return `<span class="field-ref ${isMsg ? 'is-msg' : ''}" data-field="${clean}">${clean}</span>`;
    }
    return full;
  });
}

function renderAll() {
  const nav = document.getElementById('navList');
  const content = document.getElementById('docContent');
  nav.innerHTML = '';
  content.innerHTML = '';

  SECTIONS.forEach(sec => {
    const li = document.createElement('li');
    li.className = `nav-item level-${sec.level}`;
    li.innerHTML = `<a href="#${sec.id}" data-nav="${sec.id}"><span>${sec.title}</span><span class="nav-badge" id="nav-badge-${sec.id}" style="display:none">0</span></a>`;
    nav.appendChild(li);

    const card = document.createElement('section');
    card.className = 'doc-section';
    card.id = sec.id;
    const hTag = `h${Math.min(4, sec.level)}`;
    card.innerHTML = `
      <div class="sec-header">
        <${hTag}>${sec.title}</${hTag}>
        <button class="btn btn-gold" onclick="toggleEditor('${sec.id}')">💬 添加批注 (<span id="sec-count-${sec.id}">0</span>)</button>
      </div>
      <div class="sec-body">${enhanceFieldsInHtml(sec.html)}</div>
      <div class="comment-bar" id="cbar-${sec.id}">
        <div class="comment-list" id="clist-${sec.id}"></div>
        <div class="comment-editor" id="ceditor-${sec.id}">
          <textarea id="ctext-${sec.id}" placeholder="输入你对「${sec.title}」的评审意见..."></textarea>
          <div class="comment-editor-row">
            <select id="ctype-${sec.id}">
              <option value="issue">🔴 问题 / 需修复</option>
              <option value="question">🟣 疑问 / 需确认</option>
              <option value="idea">🔵 优化建议</option>
              <option value="ok">🟢 确认无误</option>
            </select>
            <div style="display:flex; gap:8px;">
              <button class="btn" onclick="toggleEditor('${sec.id}', false)">取消</button>
              <button class="btn btn-primary" onclick="submitComment('${sec.id}')">保存批注</button>
            </div>
          </div>
        </div>
      </div>
    `;
    content.appendChild(card);
  });

  renderAllComments();
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
    mermaid.run({ querySelector: '.mermaid' }).then(() => enhanceMermaidTooltips()).catch(() => {});
  }
}

function enhanceMermaidTooltips() {
  const keys = Object.keys(FIELD_DICT).sort((a, b) => b.length - a.length);
  const pattern = new RegExp(`\\b(${keys.map(k => k.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')).join('|')})\\b`, 'g');
  const svgNS = 'http://www.w3.org/2000/svg';

  document.querySelectorAll('.mermaid svg text.messageText, .mermaid svg text.noteText').forEach(textEl => {
    const raw = textEl.textContent || '';
    if (!pattern.test(raw)) return;
    pattern.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let lastIdx = 0, match;
    while ((match = pattern.exec(raw)) !== null) {
      if (match.index > lastIdx) frag.appendChild(document.createTextNode(raw.slice(lastIdx, match.index)));
      const key = match[1];
      const tspan = document.createElementNS(svgNS, 'tspan');
      const isMsg = /^[A-Z0-9_]+$/.test(key);
      tspan.setAttribute('class', `svg-field-ref ${isMsg ? 'is-msg' : ''}`);
      tspan.setAttribute('data-field', key);
      tspan.textContent = key;
      frag.appendChild(tspan);
      lastIdx = pattern.lastIndex;
    }
    if (lastIdx < raw.length) frag.appendChild(document.createTextNode(raw.slice(lastIdx)));
    textEl.textContent = '';
    textEl.appendChild(frag);
  });
}

function toggleEditor(secId, force) {
  const ed = document.getElementById(`ceditor-${secId}`);
  const open = force !== undefined ? force : !ed.classList.contains('open');
  ed.classList.toggle('open', open);
  if (open) document.getElementById(`ctext-${secId}`).focus();
}
function submitComment(secId) {
  const ta = document.getElementById(`ctext-${secId}`);
  const type = document.getElementById(`ctype-${secId}`).value;
  const text = ta.value.trim();
  if (!text) return;
  if (!commentsMap[secId]) commentsMap[secId] = [];
  commentsMap[secId].push({ id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), type, text, at: new Date().toLocaleString() });
  ta.value = '';
  toggleEditor(secId, false);
  saveComments();
  renderSectionComments(secId);
}
function deleteComment(secId, cid) {
  if (!commentsMap[secId]) return;
  commentsMap[secId] = commentsMap[secId].filter(c => c.id !== cid);
  if (commentsMap[secId].length === 0) delete commentsMap[secId];
  saveComments();
  renderSectionComments(secId);
}
const TYPE_LABELS = { issue: '🔴 问题 / 需修复', question: '🟣 疑问 / 需确认', idea: '🔵 优化建议', ok: '🟢 确认无误' };
function renderSectionComments(secId) {
  const list = document.getElementById(`clist-${secId}`);
  const card = document.getElementById(secId);
  const items = commentsMap[secId] || [];
  card.classList.toggle('has-comments', items.length > 0);
  list.innerHTML = items.map(c => `
    <div class="comment-item type-${c.type}">
      <div class="comment-meta">
        <span><strong>${TYPE_LABELS[c.type] || c.type}</strong> · ${c.at}</span>
        <span class="comment-actions"><button onclick="deleteComment('${secId}', '${c.id}')">删除</button></span>
      </div>
      <div style="white-space:pre-wrap;">${escapeHtml(c.text)}</div>
    </div>
  `).join('');
  refreshCommentCounts();
}
function renderAllComments() { SECTIONS.forEach(s => renderSectionComments(s.id)); }
function refreshCommentCounts() {
  let total = 0;
  SECTIONS.forEach(s => {
    const cnt = (commentsMap[s.id] || []).length;
    total += cnt;
    const sc = document.getElementById(`sec-count-${s.id}`);
    const nb = document.getElementById(`nav-badge-${s.id}`);
    if (sc) sc.textContent = cnt;
    if (nb) { nb.textContent = cnt; nb.style.display = cnt > 0 ? 'inline-block' : 'none'; }
  });
  document.getElementById('totalCommentsBadge').textContent = total;
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

// ==================== 4. 悬浮 Tooltip & 点击跳转 ====================
const tooltip = document.getElementById('fieldTooltip');
document.addEventListener('mouseover', e => {
  const el = e.target.closest('.field-ref, .svg-field-ref');
  if (!el) return;
  const key = el.dataset.field;
  const info = FIELD_DICT[key];
  if (!info) return;
  tooltip.innerHTML = `
    <div class="tt-head"><span class="tt-name">${key}</span><span class="tt-scope">${info.scope}</span></div>
    <div class="tt-desc">${info.desc}</div>
    <div class="tt-grid">
      <span class="tt-label">生成者</span><span class="tt-val">${info.gen}</span>
      <span class="tt-label">权威者</span><span class="tt-val">${info.auth}</span>
      <span class="tt-label">发送者</span><span class="tt-val">${info.send}</span>
      <span class="tt-label">接收者</span><span class="tt-val">${info.recv}</span>
      <span class="tt-label">影响者</span><span class="tt-val">${info.eff}</span>
    </div>
    <div class="tt-hint">🖱 点击跳转到详细介绍</div>
  `;
  tooltip.style.display = 'block';
  positionTooltip(e);
});
document.addEventListener('mousemove', e => { if (tooltip.style.display === 'block') positionTooltip(e); });
document.addEventListener('mouseout', e => { if (e.target.closest('.field-ref, .svg-field-ref')) tooltip.style.display = 'none'; });
function positionTooltip(e) {
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const rect = tooltip.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - 10) x = e.clientX - rect.width - pad;
  if (y + rect.height > window.innerHeight - 10) y = e.clientY - rect.height - pad;
  tooltip.style.left = Math.max(8, x) + 'px';
  tooltip.style.top = Math.max(8, y) + 'px';
}
document.addEventListener('click', e => {
  const el = e.target.closest('.field-ref, .svg-field-ref');
  if (!el) return;
  const info = FIELD_DICT[el.dataset.field];
  if (info && info.targetId) jumpToTarget(info.targetId);
});
function jumpToTarget(targetId) {
  const target = document.getElementById(targetId);
  if (!target) return;
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.remove('flash-highlight', 'section-flash');
  void target.offsetWidth;
  target.classList.add(target.tagName === 'TR' ? 'flash-highlight' : 'section-flash');
}

// ==================== 5. 搜索、过滤与导出 ====================
const searchBox = document.getElementById('fieldSearch');
const searchResults = document.getElementById('searchResults');
searchBox.addEventListener('input', () => {
  const q = searchBox.value.trim().toLowerCase();
  if (!q) { searchResults.style.display = 'none'; return; }
  const hits = Object.keys(FIELD_DICT).filter(k => k.toLowerCase().includes(q) || FIELD_DICT[k].desc.toLowerCase().includes(q));
  searchResults.innerHTML = hits.length
    ? hits.map(k => `<div style="padding:4px 6px; cursor:pointer; border-radius:4px;" onmouseover="this.style.background='#26354d'" onmouseout="this.style.background=''" onclick="jumpToTarget('${FIELD_DICT[k].targetId}')"><strong style="color:var(--accent); font-family:monospace;">${k}</strong><span style="color:var(--text-muted);"> — ${FIELD_DICT[k].scope}</span></div>`).join('')
    : '<div style="color:var(--text-muted); padding:4px;">未找到匹配字段</div>';
  searchResults.style.display = 'block';
});
let filterOnlyComments = false;
document.getElementById('btnToggleCommentFilter').addEventListener('click', e => {
  filterOnlyComments = !filterOnlyComments;
  e.target.classList.toggle('btn-gold', filterOnlyComments);
  SECTIONS.forEach(s => {
    const has = (commentsMap[s.id] || []).length > 0;
    document.getElementById(s.id).style.display = (!filterOnlyComments || has) ? 'block' : 'none';
  });
});
document.getElementById('btnClearAllComments').addEventListener('click', () => {
  if (!confirm('确定要清空所有 V2 批注吗？')) return;
  commentsMap = {}; saveComments(); renderAllComments();
});
document.getElementById('btnExportComments').addEventListener('click', () => {
  const lines = ['# NETWORK_AND_SYNC.md (V2) 评审批注汇总', `> 导出时间：${new Date().toLocaleString()}`, ''];
  let count = 0;
  SECTIONS.forEach(s => {
    const items = commentsMap[s.id] || [];
    if (!items.length) return;
    lines.push(`## ${s.title}`);
    items.forEach((c, idx) => { count++; lines.push(`${idx + 1}. **[${TYPE_LABELS[c.type] || c.type}]** (${c.at})\n   ${c.text.replace(/\n/g, '\n   ')}`); });
    lines.push('');
  });
  if (count === 0) lines.push('（当前暂无任何批注）');
  document.getElementById('exportText').value = lines.join('\n');
  document.getElementById('exportModal').classList.add('open');
});
function closeExportModal() { document.getElementById('exportModal').classList.remove('open'); }
document.getElementById('btnCopyExport').addEventListener('click', () => {
  const ta = document.getElementById('exportText'); ta.select(); navigator.clipboard?.writeText(ta.value); alert('已复制到剪贴板！');
});
document.getElementById('btnDownloadExport').addEventListener('click', () => {
  const blob = new Blob([document.getElementById('exportText').value], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'NETWORK_AND_SYNC_V2_COMMENTS.md'; a.click();
});

renderAll();
